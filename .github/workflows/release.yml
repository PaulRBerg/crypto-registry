# Publishes stable version tags through npm trusted publishing, creates the
# corresponding GitHub release, and syncs the major version branch.
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  id-token: write

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.0

      - name: Set up npm
        run: npm install --global npm@11.5.1

      - name: Set up Ni package manager resolver
        run: npm install --global @antfu/ni

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up just
        uses: extractions/setup-just@v3

      - name: Verify release tag
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE_NAME="$(node --print "require('./package.json').name")"
          PACKAGE_VERSION="$(node --print "require('./package.json').version")"
          EXPECTED_TAG="v${PACKAGE_VERSION}"

          if [[ ! "$PACKAGE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "package.json version must be a stable X.Y.Z version: $PACKAGE_VERSION" >&2
            exit 1
          fi

          if [[ "$GITHUB_REF_NAME" != "$EXPECTED_TAG" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $EXPECTED_TAG" >&2
            exit 1
          fi

          {
            echo "PACKAGE_NAME=$PACKAGE_NAME"
            echo "PACKAGE_VERSION=$PACKAGE_VERSION"
          } >> "$GITHUB_ENV"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check code
        run: just full-check

      - name: Test
        run: just test

      - name: Build
        run: just build

      - name: Check npm registry
        id: npm-version
        shell: bash
        run: |
          set -euo pipefail

          NPM_VIEW_ERROR="$(mktemp "$RUNNER_TEMP/npm-view.XXXXXX")"
          trap 'rm -f "$NPM_VIEW_ERROR"' EXIT

          if PUBLISHED_VERSION="$(
            npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version \
              --registry=https://registry.npmjs.org/ \
              --color=false 2>"$NPM_VIEW_ERROR"
          )"; then
            if [[ "$PUBLISHED_VERSION" != "$PACKAGE_VERSION" ]]; then
              echo "npm returned unexpected version '$PUBLISHED_VERSION' for $PACKAGE_NAME@$PACKAGE_VERSION" >&2
              exit 1
            fi

            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "$PACKAGE_NAME@$PACKAGE_VERSION is already published; skipping npm publish"
          else
            npm_view_status=$?
            if grep -Eq '^npm (error|ERR!)[[:space:]]+code[[:space:]]+E404[[:space:]]*$' "$NPM_VIEW_ERROR"; then
              echo "publish=true" >> "$GITHUB_OUTPUT"
              echo "$PACKAGE_NAME@$PACKAGE_VERSION is not published"
            else
              echo "npm registry query failed; refusing to publish" >&2
              exit "$npm_view_status"
            fi
          fi

      - name: Publish to npm
        if: steps.npm-version.outputs.publish == 'true'
        run: npm publish

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "GitHub release $GITHUB_REF_NAME already exists; skipping creation"
          else
            gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
          fi

      - name: Sync major version branch with release tag
        shell: bash
        run: |
          set -euo pipefail

          MAJOR_BRANCH="${GITHUB_REF_NAME%%.*}"
          echo "Syncing branch '$MAJOR_BRANCH' with tag '$GITHUB_REF_NAME'"
          git push origin "HEAD:refs/heads/$MAJOR_BRANCH" --force
