# Publishes stable version tags or on-demand development versions through npm
# trusted publishing. Stable releases also create a GitHub release and sync the
# major version branch.
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact origin/main commit to publish
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.18.0

      - name: Set up npm
        run: npm install --global npm@11.5.1

      - name: Set up Ni package manager resolver
        run: npm install --global @antfu/ni

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up just
        uses: extractions/setup-just@v4

      - name: Verify release source
        env:
          EXPECTED_COMMIT: ${{ inputs.commit_sha }}
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE_NAME="$(node --print "require('./package.json').name")"
          BASE_VERSION="$(node --print "require('./package.json').version")"

          if [[ ! "$BASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "package.json version must be a stable X.Y.Z version: $BASE_VERSION" >&2
            exit 1
          fi

          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            EXPECTED_TAG="v${BASE_VERSION}"
            if [[ "$GITHUB_REF_NAME" != "$EXPECTED_TAG" ]]; then
              echo "Tag $GITHUB_REF_NAME does not match package.json version $EXPECTED_TAG" >&2
              exit 1
            fi
            RELEASE_CHANNEL="stable"
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
              echo "Development releases must be dispatched from main: $GITHUB_REF" >&2
              exit 1
            fi
            if [[ ! "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]] || [[ "$GITHUB_SHA" != "$EXPECTED_COMMIT" ]]; then
              echo "Dispatched commit $GITHUB_SHA does not match expected commit $EXPECTED_COMMIT" >&2
              exit 1
            fi
            RELEASE_CHANNEL="dev"
          else
            echo "Unsupported release event: $GITHUB_EVENT_NAME" >&2
            exit 1
          fi

          {
            echo "PACKAGE_NAME=$PACKAGE_NAME"
            echo "BASE_VERSION=$BASE_VERSION"
            echo "RELEASE_CHANNEL=$RELEASE_CHANNEL"
          } >> "$GITHUB_ENV"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check code
        run: just full-check

      - name: Test
        run: just test

      - name: Resolve package version
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE_VERSION="$BASE_VERSION"
          ALREADY_PUBLISHED="false"

          if [[ "$RELEASE_CHANNEL" == "dev" ]]; then
            NPM_VIEW_ERROR="$(mktemp "$RUNNER_TEMP/npm-dev-view.XXXXXX")"
            trap 'rm -f "$NPM_VIEW_ERROR"' EXIT

            if DEV_METADATA="$(
              npm view "${PACKAGE_NAME}@dev" version gitHead \
                --json \
                --registry=https://registry.npmjs.org/ \
                --color=false 2>"$NPM_VIEW_ERROR"
            )"; then
              DEV_VERSION="$(jq -er '.version | select(type == "string")' <<< "$DEV_METADATA")"
              DEV_GIT_HEAD="$(jq -r '.gitHead // ""' <<< "$DEV_METADATA")"
              if [[ "$DEV_GIT_HEAD" == "$GITHUB_SHA" ]]; then
                PACKAGE_VERSION="$DEV_VERSION"
                ALREADY_PUBLISHED="true"
              fi
            else
              npm_view_status=$?
              if ! grep -Eq '^npm (error|ERR!)[[:space:]]+code[[:space:]]+E404[[:space:]]*$' "$NPM_VIEW_ERROR"; then
                echo "npm registry query for the dev tag failed; refusing to publish" >&2
                exit "$npm_view_status"
              fi
            fi

            if [[ "$ALREADY_PUBLISHED" == "false" ]]; then
              RELEASE_DATE="$(date -u +%Y%m%d)"
              PACKAGE_VERSION="$(
                npm view "$PACKAGE_NAME" versions \
                  --json \
                  --registry=https://registry.npmjs.org/ \
                  --color=false |
                  bun scripts/release-version.ts "$BASE_VERSION" "$RELEASE_DATE"
              )"
            fi

            npm pkg set "version=$PACKAGE_VERSION"
            ACTUAL_VERSION="$(node --print "require('./package.json').version")"
            if [[ "$ACTUAL_VERSION" != "$PACKAGE_VERSION" ]]; then
              echo "Failed to set package.json version to $PACKAGE_VERSION" >&2
              exit 1
            fi
          fi

          {
            echo "PACKAGE_VERSION=$PACKAGE_VERSION"
            echo "ALREADY_PUBLISHED=$ALREADY_PUBLISHED"
          } >> "$GITHUB_ENV"

      - name: Build
        run: just build

      - name: Check npm registry
        id: npm-version
        shell: bash
        run: |
          set -euo pipefail

          NPM_VIEW_ERROR="$(mktemp "$RUNNER_TEMP/npm-view.XXXXXX")"
          trap 'rm -f "$NPM_VIEW_ERROR"' EXIT

          if [[ "$ALREADY_PUBLISHED" == "true" ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "$PACKAGE_NAME@$PACKAGE_VERSION already represents $GITHUB_SHA; skipping npm publish"
            exit 0
          fi

          if PUBLISHED_VERSION="$(
            npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version \
              --registry=https://registry.npmjs.org/ \
              --color=false 2>"$NPM_VIEW_ERROR"
          )"; then
            if [[ "$PUBLISHED_VERSION" != "$PACKAGE_VERSION" ]]; then
              echo "npm returned unexpected version '$PUBLISHED_VERSION' for $PACKAGE_NAME@$PACKAGE_VERSION" >&2
              exit 1
            fi

            if [[ "$RELEASE_CHANNEL" == "dev" ]]; then
              echo "Development version collision at $PACKAGE_NAME@$PACKAGE_VERSION" >&2
              exit 1
            fi

            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "$PACKAGE_NAME@$PACKAGE_VERSION is already published; skipping npm publish"
          else
            npm_view_status=$?
            if grep -Eq '^npm (error|ERR!)[[:space:]]+code[[:space:]]+E404[[:space:]]*$' "$NPM_VIEW_ERROR"; then
              echo "publish=true" >> "$GITHUB_OUTPUT"
              echo "$PACKAGE_NAME@$PACKAGE_VERSION is not published"
            else
              echo "npm registry query failed; refusing to publish" >&2
              exit "$npm_view_status"
            fi
          fi

      - name: Publish stable version to npm
        if: steps.npm-version.outputs.publish == 'true' && env.RELEASE_CHANNEL == 'stable'
        run: npm publish

      - name: Publish development version to npm
        if: steps.npm-version.outputs.publish == 'true' && env.RELEASE_CHANNEL == 'dev'
        run: npm publish --tag dev

      - name: Summarize npm release
        shell: bash
        run: |
          {
            echo "### npm release"
            echo "- Package: \`$PACKAGE_NAME@$PACKAGE_VERSION\`"
            echo "- Channel: \`$RELEASE_CHANNEL\`"
            echo "- Source: \`$GITHUB_SHA\`"
            echo "- Published: \`${{ steps.npm-version.outputs.publish }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub release
        if: env.RELEASE_CHANNEL == 'stable'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "GitHub release $GITHUB_REF_NAME already exists; skipping creation"
          else
            gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
          fi

      - name: Sync major version branch with release tag
        if: env.RELEASE_CHANNEL == 'stable'
        shell: bash
        run: |
          set -euo pipefail

          MAJOR_BRANCH="${GITHUB_REF_NAME%%.*}"
          echo "Syncing branch '$MAJOR_BRANCH' with tag '$GITHUB_REF_NAME'"
          git push origin "HEAD:refs/heads/$MAJOR_BRANCH" --force
